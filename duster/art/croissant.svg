<svg xmlns="http://www.w3.org/2000/svg" width="84mm" height="84mm" viewBox="0 0 84 84">
  <!-- Stencil artwork for duster.scad. Units are mm, the disk centre is
       at (42,42), everything inside an 80mm circle. Strokes become the openings;
       run stroke2fill.py to make the .fill.svg the model imports.
       The crescent is drawn closed; duster.scad cuts the tie gaps. The fold
       lines stop 5mm short of the inner arc so the sections stay joined
       by a strip wide enough to count as a tie. -->
  <path fill="none" stroke="#000" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M 16,57 A 30 30 0 1 1 68,57 A 26 26 0 1 0 16,57 Z"/>
  <path fill="none" stroke="#000" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M 51.58,15.69 L 47.95,25.65"/>
  <path fill="none" stroke="#000" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M 32.42,15.69 L 36.05,25.65"/>
  <path fill="none" stroke="#000" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M 62.81,23.27 L 56.46,28.98"/>
  <path fill="none" stroke="#000" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M 21.19,23.27 L 27.54,28.98"/>
</svg>
